[package]
name = "handl-lib-base64"
version = "0.1.0"
edition = "2024"
description = "Base64 codec — Handl stdlib, implements the Encoding trait from lib-encoding."
license = "MIT"
repository = "https://github.com/handl-lang/lib-base64"
readme = "README.md"
homepage = "https://github.com/handl-lang/lib-base64"

[dependencies]
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
base64 = "0.22"

[patch."https://github.com/handl-lang/kernel"]
handl-calculus = { path = "../kernel/crates/handl-calculus" }
handl-ops = { path = "../kernel/crates/handl-ops" }
handl-language = { path = "../kernel/crates/handl-language" }
handl-lib-ops = { path = "../kernel/crates/ops" }
handl-value = { path = "../kernel/crates/handl-value" }
